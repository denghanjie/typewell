server {
    listen 80;
    listen [::]:80;
    server_name typing.denghanjie.vip;

    root /var/www/typing.denghanjie.vip;
    index index.html;
    charset utf-8;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
