server {
    listen 80;
    listen [::]:80;
    server_name typing.denghanjie.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://typing.denghanjie.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name typing.denghanjie.vip;

    root /var/www/typing.denghanjie.vip;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/typing.denghanjie.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typing.denghanjie.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8794;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
